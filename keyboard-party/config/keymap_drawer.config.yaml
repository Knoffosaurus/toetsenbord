layouts:
  COLEMAK:
    description: Colemak-DH base layer
    svg_path: colemak.svg
  NAV:
    description: Navigation layer
    svg_path: nav.svg
  NUM:
    description: Numbers and symbols
    svg_path: num.svg
  MOUSE:
    description: Mouse and macro controls
    svg_path: mouse.svg

key_labels:
  smart_num:
    tap: num
    hold: num
  smart_shft:
    tap: ⇧
    hold: ⇧
  mht_l:
    tap: "←"
    hold: "⟪"
  mht_r:
    tap: "→"
    hold: "⟫"
  mht_u:
    tap: "↑"
    hold: "⇈"
  mht_d:
    tap: "↓"
    hold: "⇊"
  sht_u:
    tap: "⇡"
    hold: "⇈"
  sht_d:
    tap: "⇣"
    hold: "⇊"

key_styles:
  default:
    font-size: 14
  trans:
    fill: "#000000"
    fill-opacity: 0.2
  held:
    fill: "#cccccc"
  sticky:
    fill: "#ffcccc"
  layer-toggle:
    fill: "#ccccff"
  layer-sticky:
    fill: "#ffccff"
  mod-morph:
    fill: "#ccffcc"
  num-word:
    fill: "#ffccaa"
  caps-word:
    fill: "#ffaacc"
  mouse-move:
    fill: "#aaccff"
  mouse-scroll:
    fill: "#ccaaff"
  mouse-button:
    fill: "#aaffcc" 